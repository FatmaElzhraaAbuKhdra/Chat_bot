
# ملف وصف مخطط قاعدة بيانات نظام JustClick ERP
# كل جدول يحتوي على: الوصف، الأعمدة، العلاقات، أمثلة

tables:

  MAIN_INV:
    description: >
      رأس فاتورة المبيعات والمشتريات. كل سطر = فاتورة واحدة.
      المبيعات: INVTYPE=0. المشتريات: INVTYPE=1.
      المرتجعات: RETURN_FLAG=1. العادي: RETURN_FLAG=0.
    columns:
      INV_KEY: "المفتاح الأساسي للـ JOIN مع DETAIL_INV — استخدمه دائماً وليس INVID"
      INVID: "رقم الفاتورة للعرض فقط — لا يُستخدم في JOIN"
      INVDATE: "تاريخ الفاتورة (DATE)"
      INVTYPE: "0=مبيعات, 1=مشتريات"
      RETURN_FLAG: "0=فاتورة عادية, 1=مرتجع"
      FINALTOTAL: "الإجمالي النهائي بعد الضريبة — هذا هو إجمالي الفاتورة الصحيح"
      INVTOTAL: "الإجمالي قبل الضريبة"
      CUST_ID: "كود العميل أو المورد — JOIN مع CUST.CUSTID"
      CUST_TYPE: "نوع العميل — JOIN مع CUST.CUST_TYPE"
      STORE_CODE: "كود المخزن"
      BRANCH_ID: "كود الفرع"
      COMPANY_CODE: "كود الشركة"
      FISCAL_YEAR: "السنة المالية"
      HEAD_NOTES: "ملاحظات الفاتورة"
    relationships:
      - "DETAIL_INV: ON detail_inv.inv_key = main_inv.inv_key"
      - "CUST: ON cust.custid = main_inv.cust_id AND cust.cust_type = main_inv.cust_type"
      - "STORE: ON store.store_code = main_inv.store_code"
    examples:
      - "المبيعات الصافية: WHERE invtype=0 AND return_flag=0"
      - "المشتريات: WHERE invtype=1 AND return_flag=0"
      - "مرتجعات المبيعات: WHERE invtype=0 AND return_flag=1"

  DETAIL_INV:
    description: >
      تفاصيل بنود الفاتورة. كل سطر = صنف واحد في الفاتورة.
      إجمالي البند = (QTY * PRICE) + ADD_VAL - SUB_VAL
    columns:
      INV_KEY: "للـ JOIN مع MAIN_INV — وليس INVID"
      ITEMID: "كود الصنف — JOIN مع ITEMS.ITEMID"
      QTY: "الكمية"
      PRICE: "سعر الوحدة"
      ADD_VAL: "إضافات على البند"
      SUB_VAL: "خصومات على البند"
    relationships:
      - "MAIN_INV: ON detail_inv.inv_key = main_inv.inv_key"
      - "ITEMS: ON items.itemid = detail_inv.itemid"

  CUST:
    description: >
      العملاء والموردين والوكلاء.
      CUST_TYPE: 0=عميل, 1=مورد, 2=وكيل.
      المفتاح الأساسي مركب: (CUSTID, CUST_TYPE)
    columns:
      CUSTID: "كود العميل/المورد"
      CUST_TYPE: "0=عميل, 1=مورد, 2=وكيل"
      CUST_NAME: "اسم العميل/المورد (عمود محسوب في بعض الاستعلامات)"
      CUST_NAME_AR: "اسم العميل بالعربي"
      CUST_NAME_EN: "اسم العميل بالإنجليزي"
      PARENT_CUST_CODE: "كود العميل الأب (للعملاء الفرعيين)"
    relationships:
      - "MAIN_INV: ON cust.custid = main_inv.cust_id AND cust.cust_type = main_inv.cust_type"
    notes: "دائماً JOIN بالعمودين معاً: CUSTID + CUST_TYPE"

  ITEMS:
    description: "جدول الأصناف والمنتجات"
    columns:
      ITEMID: "كود الصنف (PK)"
      ITEM_NAME_AR: "اسم الصنف بالعربي"
      ITEM_NAME_EN: "اسم الصنف بالإنجليزي"
      COMPANY_CODE: "كود الشركة"
      FISCAL_YEAR: "السنة المالية"
    relationships:
      - "DETAIL_INV: ON items.itemid = detail_inv.itemid"
      - "TRANSACTION_TOT: ON transaction_tot.itemid = items.itemid"

  TRANSACTION_TOT:
    description: >
      رصيد المخزون الحالي فقط — لا يحتوي على تاريخ الحركات.
      هذا الجدول للمخزون فقط ولا علاقة له بالفواتير.
    columns:
      ITEMID: "كود الصنف"
      STORE_CODE: "كود المخزن"
      QTY: "الرصيد الحالي في المخزن"
      COMPANY_CODE: "كود الشركة"
      FISCAL_YEAR: "السنة المالية"
    relationships:
      - "ITEMS: ON transaction_tot.itemid = items.itemid"
    warning: "لا تعمل JOIN بين TRANSACTION_TOT و MAIN_INV أبداً"

  STORE:
    description: "المخازن"
    columns:
      STORE_CODE: "كود المخزن (PK)"
      STORE_NAME: "اسم المخزن"

  VOUCHERS:
    description: >
      رأس القيود المحاسبية. كل سطر = قيد محاسبي واحد.
      القيد يحتوي على تفاصيل في VOUCHERS_DET.
    columns:
      VOUCHER_CODE: "رقم القيد (PK) — للـ JOIN مع VOUCHERS_DET"
      VOUCHER_DATE: "تاريخ القيد (DATE)"
      VOUCHER_DESC: "وصف/بيان القيد"
      VOUCHER_MONTH: "الشهر المحاسبي — مطلوب في JOIN مع VOUCHERS_DET"
      DOC_ID: "نوع المستند"
      COMPANY_CODE: "كود الشركة"
      FISCAL_YEAR: "السنة المالية"
      BRANCH_ID: "كود الفرع"
    relationships:
      - "VOUCHERS_DET: ON vouchers_det.voucher_code = vouchers.voucher_code AND vouchers_det.voucher_month = vouchers.voucher_month"

  VOUCHERS_DET:
    description: >
      تفاصيل القيود المحاسبية — الحركات على الحسابات.
      كل سطر = حركة على حساب واحد.
      AMOUNT موجب = مدين، AMOUNT سالب = دائن (مخزون بعلامة سالبة).
      لا يوجد عمود DEBIT أو CREDIT — المبلغ في AMOUNT فقط.
    columns:
      VOUCHER_CODE: "رقم القيد — JOIN مع VOUCHERS.VOUCHER_CODE"
      SERIAL: "رقم السطر في القيد"
      CHART_CODE: "رقم الحساب — JOIN مع CHARTS.CHART_CODE"
      AMOUNT: "المبلغ: موجب=مدين, سالب=دائن"
      COST_CODE: "كود مركز التكلفة"
      VOUCHER_DET_DESC: "وصف السطر"
      VOUCHER_MONTH: "الشهر المحاسبي — مطلوب في JOIN مع VOUCHERS"
      COMPANY_CODE: "كود الشركة"
      FISCAL_YEAR: "السنة المالية"
    relationships:
      - "VOUCHERS: ON vouchers_det.voucher_code = vouchers.voucher_code AND vouchers_det.voucher_month = vouchers.voucher_month"
      - "CHARTS: ON vouchers_det.chart_code = charts.chart_code"
    accounting_rules:
      debit: "SUM(CASE WHEN amount > 0 THEN amount ELSE 0 END)"
      credit: "SUM(CASE WHEN amount < 0 THEN ABS(amount) ELSE 0 END)"
      balance: "SUM(CASE WHEN amount > 0 THEN amount ELSE 0 END) - SUM(CASE WHEN amount < 0 THEN ABS(amount) ELSE 0 END)"

  CHARTS:
    description: >
      شجرة الحسابات.
      CHART_NATURE: 0=حساب رئيسي, 1=حساب فرعي تفصيلي.
      استخدم CHART_NATURE=1 للحسابات التفصيلية القابلة للتشغيل.
    columns:
      CHART_CODE: "رقم الحساب VARCHAR2(14) — PK"
      CHART_NAME_A: "اسم الحساب بالعربي"
      CHART_NAME_E: "اسم الحساب بالإنجليزي"
      CHART_NATURE: "0=رئيسي, 1=فرعي"
      COMPANY_CODE: "كود الشركة"
      FISCAL_YEAR: "السنة المالية"
    relationships:
      - "VOUCHERS_DET: ON charts.chart_code = vouchers_det.chart_code"

  EMPLOYEES:
    description: "الموظفون"
    columns:
      EMP_ID: "كود الموظف (PK)"
      EMP_NAME_AR: "اسم الموظف بالعربي"
      EMP_NAME_EN: "اسم الموظف بالإنجليزي"
      EMP_ACTIVE: "حالة الموظف: Y=نشط, N=غير نشط"
      COMPANY_CODE: "كود الشركة"
      FISCAL_YEAR: "السنة المالية"

business_rules:
  - "لا تضف WHERE COMPANY_CODE أو FISCAL_YEAR في أي استعلام — متجاهَلان مؤقتاً"
  - "لا تستخدم bind variables مثل :variable — اكتب القيمة مباشرة في SQL"
  - "TRANSACTION_TOT لا يرتبط بـ MAIN_INV — لا JOIN بينهما أبداً"
  - "JOIN مع CUST دائماً بعمودين: ON cust.custid = x.cust_id AND cust.cust_type = x.cust_type"
  - "JOIN مع DETAIL_INV: ON detail_inv.inv_key = main_inv.inv_key — وليس على INVID"
  - "JOIN مع VOUCHERS_DET: ON vd.voucher_code = v.voucher_code AND vd.voucher_month = v.voucher_month"
  - "FINALTOTAL هو الإجمالي الصحيح في MAIN_INV — وليس FINALETOTAL"
  - "أسماء أعمدة CHARTS: CHART_NAME_A (عربي)، CHART_NAME_E (إنجليزي)"

query_intent_guide:
  summary_questions:
    keywords: ["إجمالي", "مجموع", "كم", "عدد", "total", "sum", "count"]
    approach: "استخدم SUM/COUNT مع GROUP BY إذا لزم — أرجع صفاً واحداً أو صفوفاً مجمّعة"
  detail_questions:
    keywords: ["تفاصيل", "كل", "قائمة", "اعرض", "details", "list", "show all"]
    approach: "أرجع صفوفاً تفصيلية مع كل الأعمدة المفيدة — تاريخ، رقم، اسم، مبلغ"
  account_details:
    description: "عند السؤال عن تفاصيل حساب معين"
    approach: >
      أرجع كل حركات الحساب من VOUCHERS_DET مع رأس القيد:
      SELECT v.VOUCHER_DATE, v.VOUCHER_CODE, v.VOUCHER_DESC,
             vd.AMOUNT,
             CASE WHEN vd.AMOUNT > 0 THEN vd.AMOUNT ELSE 0 END AS debit,
             CASE WHEN vd.AMOUNT < 0 THEN ABS(vd.AMOUNT) ELSE 0 END AS credit,
             vd.VOUCHER_DET_DESC
      FROM VOUCHERS_DET vd
      JOIN VOUCHERS v ON vd.VOUCHER_CODE = v.VOUCHER_CODE AND vd.VOUCHER_MONTH = v.VOUCHER_MONTH
      WHERE vd.CHART_CODE = 'xxxx'
      ORDER BY v.VOUCHER_DATE, vd.SERIAL
